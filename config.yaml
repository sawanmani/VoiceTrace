# VoiceTrace — Runtime Configuration
# All thresholds and weights are tunable here. No hardcoding in source files.

detection:
  window_sec: 1.0          # length of each audio window sent to AASIST-L
  stride_sec: 0.5          # hop between windows (50% overlap)
  smoothing_alpha: 0.35    # EMA alpha — lower = smoother, higher = more reactive
  target_sr: 16000         # AASIST-L expects 16 kHz mono
  nb_samp: 64600           # ~4.04 s at 16 kHz — AASIST-L fixed input length

liveness:
  silence_threshold: 0.002       # RMS below this = silence
  clipping_threshold: 0.98       # abs amplitude above this = clipping (TTS artifact)
  clipping_fraction_limit: 0.01  # >1% clipped samples → suspicious
  noise_floor_variance_min: 1e-6 # real mics always have some variance
  zcr_min: 0.01                  # zero-crossing rate thresholds
  zcr_max: 0.45

risk_thresholds:
  uncertain: 25   # 25-34 -> uncertain (F6 calibration)
  medium: 35      # 35-64 -> medium
  high: 65        # 65-100 -> high
  weights:
    spoof_prob: 0.60        # AASIST-L raw output (primary signal)
    liveness: 0.20          # liveness heuristics
    caller_context: 0.10   # caller familiarity / prior call history
    transaction_context: 0.10  # is a sensitive action being requested?

recommendations:
  low: "Voice appears genuine. No action required."
  uncertain: "Borderline signal. Inform user and ask verification questions."
  medium: "Borderline signal detected. Request additional identity verification before proceeding."
  high:   "HIGH RISK: Clone signature detected. Recommend callback on a known number before approving any transfer or disclosure."

server:
  host: "0.0.0.0"
  port: 8000
  max_calls: 50                # Fix 4: maximum concurrent WebSocket calls before rejection
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

logging:
  level: "INFO"
  log_scores: true          # log score events (no raw audio)
  log_raw_audio: false      # must stay false — privacy-by-design

# ── Privacy / Data Minimization ────────────────────────────────────────
# Aligns with DPDP Act (Digital Personal Data Protection Act 2023) —
# Section 4(1)(b): collect only data necessary for the specified purpose.
# Raw voice audio is biometric data under the Act. These flags control
# whether the server persists anything beyond ephemeral in-memory processing.
privacy:
  retain_audio: false       # NEVER write raw audio frames to disk
  retain_features: false    # Do NOT persist extracted feature embeddings
                            # Set retain_features: true only for research/eval
                            # with explicit informed consent.

# ── WebRTC ─────────────────────────────────────────────────────────
webrtc:
  stun_server: "stun:stun.l.google.com:19302"   # free public STUN, no API key
  max_room_idle_sec: 300    # destroy signaling room after 5min of inactivity
