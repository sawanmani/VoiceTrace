name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: false

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
        
    - name: Cache PyTorch models
      id: cache-models
      uses: actions/cache@v3
      with:
        path: models/weights
        key: ${{ runner.os }}-models-v1
        
    - name: Create dummy AASIST checkpoint (valid PyTorch format)
      if: steps.cache-models.outputs.cache-hit != 'true'
      run: |
        mkdir -p models/weights
        python << 'EOF'
        import torch
        import torch.nn as nn
        from pathlib import Path
        
        # Minimal CONV layer that reproduces the band_pass buffer
        class MinimalCONV(nn.Module):
            def __init__(self, out_channels=70, kernel_size=128):
                super().__init__()
                import numpy as np
                # Register band_pass as a buffer (not a parameter)
                band_pass = torch.zeros(out_channels, kernel_size)
                self.register_buffer('band_pass', band_pass)
        
        # Minimal Residual_block
        class MinimalResidual(nn.Module):
            def __init__(self):
                super().__init__()
                self.bn1 = nn.BatchNorm2d(1)
                self.conv1 = nn.Conv2d(1, 32, kernel_size=(2, 3), padding=(1, 1))
                self.bn2 = nn.BatchNorm2d(32)
                self.conv2 = nn.Conv2d(32, 32, kernel_size=(2, 3), padding=(0, 1))
                self.mp = nn.MaxPool2d((1, 3))
            
            def forward(self, x):
                return x
        
        # Minimal AASIST model that matches the actual architecture
        class DummyAASIST(nn.Module):
            def __init__(self):
                super().__init__()
                
                # conv_time with band_pass buffer
                self.conv_time = MinimalCONV(out_channels=70, kernel_size=128)
                
                # first_bn (BatchNorm2d, not BatchNorm1d)
                self.first_bn = nn.BatchNorm2d(num_features=1)
                
                # Positional encoding for spectral GAT
                self.pos_S = nn.Parameter(torch.randn(1, 23, 24))
                
                # Master nodes for heterogeneous GAT
                self.master1 = nn.Parameter(torch.randn(1, 1, 32))
                self.master2 = nn.Parameter(torch.randn(1, 1, 32))
                
                # Encoder: Sequential of residual blocks
                self.encoder = nn.Sequential(
                    nn.Sequential(MinimalResidual()),
                    nn.Sequential(MinimalResidual()),
                    nn.Sequential(MinimalResidual()),
                    nn.Sequential(MinimalResidual()),
                    nn.Sequential(MinimalResidual()),
                    nn.Sequential(MinimalResidual()),
                )
                
                # Output layer
                self.out_layer = nn.Linear(5 * 32, 2)
            
            def forward(self, x):
                x = x.unsqueeze(1)
                x = self.encoder(x)
                output = self.out_layer(x.mean(dim=-1).mean(dim=-1))
                return output, output
        
        model = DummyAASIST()
        checkpoint_path = Path("models/weights/AASIST-L.pth")
        checkpoint_path.parent.mkdir(parents=True, exist_ok=True)
        torch.save(model.state_dict(), checkpoint_path)
        print(f"✓ Created dummy checkpoint at {checkpoint_path}")
        EOF
        
    - name: Run Tests
      env:
        VOICETRACE_API_KEY: "ci-test-key"
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m pytest tests/ -v
