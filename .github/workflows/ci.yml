name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: false

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
        
    - name: Cache PyTorch models
      id: cache-models
      uses: actions/cache@v3
      with:
        path: models/weights
        key: ${{ runner.os }}-models-v1
        
    - name: Create dummy AASIST checkpoint (valid PyTorch format)
      if: steps.cache-models.outputs.cache-hit != 'true'
      run: |
        mkdir -p models/weights
        python << 'EOF'
        import torch
        import torch.nn as nn
        from pathlib import Path
        
        # AASIST-L config from detector/inference.py
        AASIST_L_CONFIG = {
            "architecture": "AASIST",
            "nb_samp": 64600,
            "first_conv": 128,
            "filts": [70, [1, 32], [32, 32], [32, 24], [24, 24]],
            "gat_dims": [24, 32],
            "pool_ratios": [0.4, 0.5, 0.7, 0.5],
            "temperatures": [2.0, 2.0, 100.0, 100.0],
        }
        
        # Minimal CONV layer with band_pass buffer
        class MinimalCONV(nn.Module):
            def __init__(self, out_channels=70, kernel_size=128):
                super().__init__()
                band_pass = torch.zeros(out_channels, kernel_size)
                self.register_buffer('band_pass', band_pass)
        
        # Residual block with conditional downsample
        class MinimalResidual(nn.Module):
            def __init__(self, nb_filts, first=False):
                super().__init__()
                self.first = first
                
                if not self.first:
                    self.bn1 = nn.BatchNorm2d(num_features=nb_filts[0])
                self.conv1 = nn.Conv2d(in_channels=nb_filts[0],
                                       out_channels=nb_filts[1],
                                       kernel_size=(2, 3),
                                       padding=(1, 1),
                                       stride=1)
                self.bn2 = nn.BatchNorm2d(num_features=nb_filts[1])
                self.conv2 = nn.Conv2d(in_channels=nb_filts[1],
                                       out_channels=nb_filts[1],
                                       kernel_size=(2, 3),
                                       padding=(0, 1),
                                       stride=1)
                
                if nb_filts[0] != nb_filts[1]:
                    self.downsample = True
                    self.conv_downsample = nn.Conv2d(in_channels=nb_filts[0],
                                                     out_channels=nb_filts[1],
                                                     padding=(0, 1),
                                                     kernel_size=(1, 3),
                                                     stride=1)
                else:
                    self.downsample = False
                    
                self.mp = nn.MaxPool2d((1, 3))
        
        # Graph Attention Layer
        class MinimalGraphAttentionLayer(nn.Module):
            def __init__(self, in_dim, out_dim, temperature=2.0):
                super().__init__()
                self.att_weight = nn.Parameter(torch.randn(in_dim, in_dim))
                self.att_proj = nn.Linear(in_dim, out_dim)
        
        # Dummy AASIST model matching actual architecture
        class DummyAASIST(nn.Module):
            def __init__(self, d_args):
                super().__init__()
                
                filts = d_args["filts"]
                gat_dims = d_args["gat_dims"]
                
                self.conv_time = MinimalCONV(out_channels=filts[0],
                                             kernel_size=d_args["first_conv"])
                self.first_bn = nn.BatchNorm2d(num_features=1)
                
                self.encoder = nn.Sequential(
                    nn.Sequential(MinimalResidual(nb_filts=filts[1], first=True)),
                    nn.Sequential(MinimalResidual(nb_filts=filts[2])),
                    nn.Sequential(MinimalResidual(nb_filts=filts[3])),
                    nn.Sequential(MinimalResidual(nb_filts=filts[4])),
                    nn.Sequential(MinimalResidual(nb_filts=filts[4])),
                    nn.Sequential(MinimalResidual(nb_filts=filts[4]))
                )
                
                self.pos_S = nn.Parameter(torch.randn(1, 23, filts[-1][-1]))
                self.master1 = nn.Parameter(torch.randn(1, 1, gat_dims[0]))
                self.master2 = nn.Parameter(torch.randn(1, 1, gat_dims[0]))
                
                self.GAT_layer_S = MinimalGraphAttentionLayer(filts[-1][-1], gat_dims[0])
                self.GAT_layer_T = MinimalGraphAttentionLayer(filts[-1][-1], gat_dims[0])
                
                self.out_layer = nn.Linear(5 * gat_dims[1], 2)
            
            def forward(self, x):
                return torch.zeros(x.size(0), 2), torch.zeros(x.size(0), 2)
        
        model = DummyAASIST(AASIST_L_CONFIG)
        checkpoint_path = Path("models/weights/AASIST-L.pth")
        checkpoint_path.parent.mkdir(parents=True, exist_ok=True)
        torch.save(model.state_dict(), checkpoint_path)
        print(f"✓ Created dummy checkpoint at {checkpoint_path}")
        EOF
        
    - name: Run Tests
      env:
        VOICETRACE_API_KEY: "ci-test-key"
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m pytest tests/ -v
