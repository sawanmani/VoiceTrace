name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
        
    - name: Cache PyTorch models
      id: cache-models
      uses: actions/cache@v3
      with:
        path: models/weights
        key: ${{ runner.os }}-models-v1
        
    - name: Create dummy AASIST checkpoint (valid PyTorch format)
      if: steps.cache-models.outputs.cache-hit != 'true'
      run: |
        mkdir -p models/weights
        python << 'EOF'
        import torch
        import torch.nn as nn
        from pathlib import Path
        
        # Create a dummy model that matches AASIST-L architecture expectations
        class DummyAASIST(nn.Module):
            def __init__(self):
                super().__init__()
                self.conv1 = nn.Conv1d(1, 128, 11, padding=5)
                self.linear = nn.Linear(128, 2)
            
            def forward(self, x):
                x = self.conv1(x)
                x = x.mean(dim=-1)
                x = self.linear(x)
                return x, x
        
        model = DummyAASIST()
        checkpoint_path = Path("models/weights/AASIST-L.pth")
        checkpoint_path.parent.mkdir(parents=True, exist_ok=True)
        torch.save(model.state_dict(), checkpoint_path, weights_only=True)
        print(f"✓ Created dummy checkpoint at {checkpoint_path}")
        EOF
        
    - name: Run Tests
      env:
        VOICETRACE_API_KEY: "ci-test-key"
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m pytest tests/ -v
