name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: false
      
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Delete git history to avoid pushing large old files
          rm -rf .git
          
          # 2. Delete the offending files and directories
          rm -f cloudflared.exe
          rm -rf models/spk_cache models/asr_cache
          
          # 3. Remove large media files that exceed limits
          find . -type f \( -name "*.jpg" -o -name "*.png" -o -name "*.mp4" -o -name "*.exe" \) -delete
          
          # 4. Remove git-related files from previous repo
          rm -rf .git .gitattributes
          
          # 5. Create a fresh git repository just for Hugging Face
          git init
          git checkout -b main
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          # 5.5 Set up Git LFS for the model file (HF requires this for binaries)
          git lfs install
          git lfs track "*.pth"
          
          # 6. Add all remaining files and commit
          git add .gitattributes
          git add .
          git add -f models/weights/AASIST-L.pth
          git commit -m "Deploy latest version from GitHub"
          
          # 7. Force push this single clean commit to Hugging Face
          git push --force https://Adarshmani:$HF_TOKEN@huggingface.co/spaces/Adarshmani/VoiceTrace-Backend main
