name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Delete git history to avoid pushing large old files
          rm -rf .git
          
          # 2. Delete the offending files (like cloudflared.exe and caches)
          rm -f cloudflared.exe
          rm -rf models/spk_cache models/asr_cache
          
          # 3. Create a fresh git repository just for Hugging Face
          git init
          git checkout -b main
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          # 4. Add all remaining files and commit
          git add .
          git commit -m "Deploy latest version from GitHub"
          
          # 5. Force push this single clean commit to Hugging Face
          git push --force https://Adarshmani:$HF_TOKEN@huggingface.co/spaces/Adarshmani/VoiceTrace-Backend main
