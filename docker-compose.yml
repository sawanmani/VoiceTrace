services:
  redis:
    image: redis:7-alpine
    container_name: voicetrace_redis
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: voicetrace_backend
    env_file: .env
    environment:
      # Database uses local SQLite via aiosqlite. Future: migrate to PostgreSQL.
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: always

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../Dockerfile.dashboard
    container_name: voicetrace_dashboard
    ports:
      - "5173:80"
    restart: always

  asterisk:
    build: ./asterisk-docker
    container_name: voicetrace_asterisk
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10100:10000-10100/udp"
    environment:
      - SIP_PROVIDER_HOST=sip2sip.info
      - SIP_USERNAME=sawan
      - SIP_PASSWORD=teamvoicetrace
    restart: always

  turn:
    image: coturn/coturn:latest
    container_name: voicetrace_coturn
    network_mode: host
    environment:
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET:-vt_turn_5a4f3e2d1c0b9b4e6d3c2a1f0e8b7d6c}
    command:
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-vt_turn_5a4f3e2d1c0b9b4e6d3c2a1f0e8b7d6c}
      - --realm=voicetrace.local
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49152
      - --max-port=65535
      - --no-tls
      - --verbose
    restart: always
