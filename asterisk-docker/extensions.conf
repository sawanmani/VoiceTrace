; VoiceTrace — Asterisk Dialplan
;
; Routes ALL incoming calls (local softphone + internet SIP) to
; VoiceTrace's AudioSocket for real-time AI voice clone detection.
;
; No Twilio. No paid numbers. Just free SIP.

[voicetrace]

; ── Incoming from SIP trunk (free internet SIP call) ─────────────
exten => s,1,Answer()
 same => n,Playback(silence/1)
 same => n,AudioSocket(,backend:1579)
 same => n,Hangup()

; ── Local softphone dialing another extension ────────────────────
; demo dials demo2, or vice versa — Asterisk bridges the call
; AND taps audio via AudioSocket for VoiceTrace detection
exten => 1001,1,Answer()
 same => n,Playback(silence/1)
 same => n,AudioSocket(${RAND(10000000,99999999)}-0000-0000-0000-000000000000,backend:1579)
 same => n,Hangup()

exten => 1002,1,Answer()
 same => n,Playback(silence/1)
 same => n,AudioSocket(${RAND(10000000,99999999)}-0000-0000-0000-000000000000,backend:1579)
 same => n,Hangup()

; ── Catch-all: any number dialed → pipe to VoiceTrace ────────────
exten => _X.,1,Answer()
 same => n,Playback(silence/1)
 same => n,AudioSocket(${RAND(10000000,99999999)}-0000-0000-0000-000000000000,backend:1579)
 same => n,Hangup()

exten => _[a-zA-Z0-9].,1,Answer()
 same => n,Playback(silence/1)
 same => n,AudioSocket(${RAND(10000000,99999999)}-0000-0000-0000-000000000000,backend:1579)
 same => n,Hangup()
