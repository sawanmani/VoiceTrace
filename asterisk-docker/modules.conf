; VoiceTrace — Asterisk Module Loader
;
; Only load what we need: SIP (PJSIP) + AudioSocket.
; Everything else disabled for speed and smaller footprint.

[modules]
autoload=yes

; We don't need these — disable to speed up startup
noload = chan_sip.so           ; old SIP module (we use PJSIP)
noload = res_pjsip_registrar_expire.so
noload = res_ari.so
noload = res_ari_model.so
noload = res_stasis.so
noload = res_http_websocket.so
noload = app_voicemail.so
noload = app_queue.so
noload = app_confbridge.so
noload = app_meetme.so
noload = app_record.so
noload = app_page.so
noload = res_fax.so
noload = chan_iax2.so
noload = chan_mgcp.so
noload = chan_skinny.so
noload = chan_unistim.so
