; VoiceTrace — Asterisk PJSIP Configuration
;
; THREE free connection modes:
;   1. LOCAL SOFTPHONE: "demo" user connects via MicroSIP (LAN, offline)
;   2. SIP2SIP.INFO:    Free internet SIP calls via sip2sip.info
;   3. LINPHONE:        Free internet SIP calls via sip.linphone.org
;
; No Twilio. No money. No PSTN number needed.
; Anyone installs Linphone on their phone → calls your SIP address → VoiceTrace detects.

; ── Transport ──────────────────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2

; ══════════════════════════════════════════════════════════════════
; MODE 1: Local Softphone (MicroSIP / Ooh Link) — works offline
; ══════════════════════════════════════════════════════════════════

[demo]
type=endpoint
context=voicetrace
disallow=all
allow=ulaw
allow=alaw
allow=opus
allow=speex
allow=speex16
allow=speex32
allow=g722
allow=gsm
auth=demo
aors=demo
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[demo]
type=auth
auth_type=userpass
username=demo
password=voicetrace123

[demo]
type=aor
max_contacts=5
remove_existing=yes

; ── Second local user for 2-party testing ────────────────────────
[demo2]
type=endpoint
context=voicetrace
disallow=all
allow=ulaw
allow=alaw
allow=opus
allow=speex
allow=speex16
allow=speex32
allow=g722
allow=gsm
auth=demo2
aors=demo2
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[demo2]
type=auth
auth_type=userpass
username=demo2
password=voicetrace456

[demo2]
type=aor
max_contacts=5
remove_existing=yes

; ══════════════════════════════════════════════════════════════════
; MODE 2: Free SIP Provider Registration
;
; Register with a free SIP provider so anyone on the internet can
; call your Asterisk. Set env vars in docker-compose.yml:
;
;   SIP_PROVIDER_HOST  — e.g. sip2sip.info or sip.linphone.org
;   SIP_USERNAME       — your free account username
;   SIP_PASSWORD       — your free account password
;
; How it works:
;   1. Create free account at sip2sip.info or linphone.org
;   2. Set credentials in docker-compose.yml
;   3. Asterisk registers with the provider
;   4. Anyone calls your SIP address (e.g. yourname@sip2sip.info)
;   5. Call arrives at Asterisk → AudioSocket → VoiceTrace
;
; Placeholders are replaced by entrypoint.sh at container startup.
; ══════════════════════════════════════════════════════════════════

[sip-trunk-reg]
type=registration
transport=transport-udp
outbound_auth=sip-trunk-auth
server_uri=sip:${SIP_PROVIDER_HOST}
client_uri=sip:${SIP_USERNAME}@${SIP_PROVIDER_HOST}
retry_interval=60
line=yes
endpoint=sip-trunk-endpoint

[sip-trunk-auth]
type=auth
auth_type=userpass
username=${SIP_USERNAME}
password=${SIP_PASSWORD}

[sip-trunk-endpoint]
type=endpoint
context=voicetrace
disallow=all
allow=ulaw
allow=alaw
allow=opus
allow=g722
auth=sip-trunk-auth
aors=sip-trunk-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[sip-trunk-aor]
type=aor
contact=sip:${SIP_PROVIDER_HOST}
qualify_frequency=60

[sip-trunk-identify]
type=identify
endpoint=sip-trunk-endpoint
match=${SIP_PROVIDER_HOST}
