; =============================================
; VoiceTrace — PJSIP Configuration
; SIH 2026 | PSID 260104
; =============================================
;
; This config sets up:
;   1. UDP transport on port 5060
;   2. A local softphone endpoint for SIH demo (no real phone number needed)
;   3. A commented-out template for production SIP trunk (Exotel/KnowLarity)
;
; Cost: ₹0 (local softphone only)

; ── Transport ──────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ── Local Softphone Endpoint (SIH Demo) ────────────────
[softphone]
type=endpoint
context=voicetrace-inbound
disallow=all
allow=ulaw
allow=alaw
auth=softphone-auth
aors=softphone-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[softphone-auth]
type=auth
auth_type=userpass
username=voicetrace
password=sih2026demo

[softphone-aor]
type=aor
max_contacts=5
remove_existing=yes

; ── Production SIP Trunk Template (Commented Out) ──────
; Uncomment and configure for Exotel/KnowLarity/Twilio SIP trunk
; to receive real +91 phone calls.
;
; [exotel-trunk]
; type=endpoint
; context=voicetrace-inbound
; disallow=all
; allow=ulaw
; transport=transport-udp
; outbound_auth=exotel-auth
; aors=exotel-aor
; direct_media=no
;
; [exotel-auth]
; type=auth
; auth_type=userpass
; username=YOUR_EXOTEL_SIP_USERNAME
; password=YOUR_EXOTEL_SIP_PASSWORD
;
; [exotel-aor]
; type=aor
; contact=sip:YOUR_EXOTEL_SIP_SERVER:5060
