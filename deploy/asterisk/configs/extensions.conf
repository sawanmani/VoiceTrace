; =============================================
; VoiceTrace — Dialplan Configuration
; SIH 2026 | PSID 260104
; =============================================
;
; Routes ALL incoming calls through AudioSocket to VoiceTrace.
; AudioSocket sends raw 8kHz PCM audio over TCP to our Python server.
;
; Target: 127.0.0.1:1579 (VoiceTrace AudioSocket TCP server)
; This works because WSL2 and Windows share localhost networking.

[voicetrace-inbound]
; Extension 100 — main VoiceTrace analysis line
exten => 100,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(custom/voicetrace-welcome)
 same => n,AudioSocket(${CHANNEL(uniqueid)},127.0.0.1:1579)
 same => n,Hangup()

; Catch-all — any dialed extension routes to VoiceTrace
exten => _X.,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(custom/voicetrace-welcome)
 same => n,AudioSocket(${CHANNEL(uniqueid)},127.0.0.1:1579)
 same => n,Hangup()
